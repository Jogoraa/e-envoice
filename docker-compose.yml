services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ut_einvoice_postgres
    environment:
      POSTGRES_DB: ut_einvoice_db
      POSTGRES_USER: ${POSTGRES_ADMIN_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_ADMIN_PASSWORD:?Database administrator password must be provided}
      APP_DB_USER: ${DB_USERNAME:-ut_app_user}
      APP_DB_PASSWORD: ${DB_PASSWORD:?Application database password must be provided}
    ports:
      # Hardened: Bind exclusively to 127.0.0.1 for local administrative debugging; NEVER expose publicly to 0.0.0.0
      - "127.0.0.1:5435:5432"
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - ./infrastructure/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infrastructure/postgres/01-init-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ut_einvoice_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ut_einvoice_redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD:?Redis password must be provided}"]
    ports:
      # Hardened: Bind exclusively to 127.0.0.1 for local debugging; NEVER expose publicly to 0.0.0.0
      - "127.0.0.1:6380:6379"
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ut_einvoice_platform
    ports:
      - "8081:8081"
      - "8080:8081"
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-prod}
      DB_URL: jdbc:postgresql://postgres:5432/ut_einvoice_db
      # Application connects strictly as unprivileged non-superuser runtime role ut_app_user (Rule 1 & 6)
      DB_USERNAME: ${DB_USERNAME:-ut_app_user}
      DB_PASSWORD: ${DB_PASSWORD:?Application database password must be provided}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Redis password must be provided}
      JWT_SECRET: ${JWT_SECRET:?JWT secret must be provided externally}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
