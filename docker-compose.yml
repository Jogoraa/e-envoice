
services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: ut_einvoice_postgres
    environment:
      POSTGRES_DB: ut_einvoice_db
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-CHANGE_ME_DATABASE_PASSWORD}
    ports:
      - "5435:5432"  # host 5435 → container 5432 (avoids conflict with host postgres on 5432)
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    volumes:
      - ./infrastructure/postgres/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./infrastructure/postgres/01-init-extensions.sql:/docker-entrypoint-initdb.d/01-init-extensions.sql:ro
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ut_einvoice_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: ut_einvoice_redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf"]
    ports:
      - "6380:6379"  # host 6380 → container 6379 (avoids conflict with restaurant-redis on 6379)
    volumes:
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ut_einvoice_platform
    ports:
      - "8081:8081"
      - "8080:8081"
    env_file:
      - .env
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/ut_einvoice_db
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:-CHANGE_ME_DATABASE_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
