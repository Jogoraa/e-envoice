spring:
  datasource:
    url: jdbc:h2:mem:ut_test_db;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
    hikari:
      # Sized for high-concurrency adversarial tests:
      # ImmutableAuditAdversarialTestSuite uses up to 20 threads, each requiring
      # a JPA transaction plus nested REQUIRES_NEW stream-lock transactions.
      # The default pool of 10 is insufficient; 50 provides safe headroom.
      # minimum-idle is intentionally omitted: keeping idle connections alive
      # between test classes risks H2 session state (RLS tenant context) leaking
      # across suites in the full mvn test run.
      maximum-pool-size: 50
      connection-timeout: 30000
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  flyway:
    enabled: false
  data:
    redis:
      host: localhost
      port: 6379

mor:
  gateway:
    base-url: http://core.mor.gov.et

outbox:
  relay:
    interval-ms: 3600000

notifications:
  sms:
    worker:
      interval-ms: 3600000
    reconciliation:
      interval-ms: 3600000

logging:
  level:
    et.ut.einvoice: INFO
