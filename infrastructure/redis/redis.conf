# =====================================================================
# UT Electronic Invoicing SaaS Platform — Redis Production Config
# Tuned for Rate Limiting Token Buckets, Idempotency Locks, and Caching
# =====================================================================

# NETWORK
bind 0.0.0.0
protected-mode no
port 6379
tcp-backlog 511
timeout 0
tcp-keepalive 300

# GENERAL
daemonize no
loglevel notice
logfile ""
databases 16

# PERSISTENCE (AOF enabled for outbox lock resilience)
save 900 1
save 300 10
save 60 10000

stop-writes-on-bgsave-error yes
rdbcompression yes
rdbchecksum yes
dbfilename dump.rdb
dir /data

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# MEMORY MANAGEMENT
# Volatile-LRU ensures temporary keys (rate limiter token buckets, session caches)
# are gracefully evicted when memory threshold is reached, without dropping persistent locks.
maxmemory 2gb
maxmemory-policy volatile-lru
maxmemory-samples 5

# LAZY FREEING
lazyfree-lazy-eviction yes
lazyfree-lazy-expire yes
lazyfree-lazy-server-del yes
replica-lazy-flush yes
