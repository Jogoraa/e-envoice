server:
  port: ${SERVER_PORT:8081}
  shutdown: graceful
  forward-headers-strategy: framework
  max-http-request-header-size: 8KB
  error:
    include-message: never
    include-binding-errors: never
    include-stacktrace: never
    include-exception: false

spring:
  application:
    name: ut-einvoice-platform
  profiles:
    active: dev
  threads:
    virtual:
      enabled: true

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5435/ut_einvoice_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      idle-timeout: 300000
      connection-timeout: 20000
      max-lifetime: 1200000
      pool-name: UtHikariPool

  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    open-in-view: false
    show-sql: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        format_sql: false
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 2000ms
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# Compliance & System Version Metadata (Directive Art. 9 & 11)
platform:
  version: 1.0.0-RELEASE
  build-checksum: "SHA256-PENDING-BUILD"
  system-number: "8EFBBDD7FF"
  system-type: "ERP"
  default-currency: "ETB"
  offline-sla-hours: 72
  cancellation-sla-hours: 48
  invitation:
    # Canonical public Flutter/Web origin. Set APP_PUBLIC_URL in every deployed environment.
    public-url: ${APP_PUBLIC_URL:http://localhost:3000}
    expiration-hours: ${INVITATION_EXPIRATION_HOURS:72}
  api:
    # The URL path is authoritative: /api/v{major}/... . Add a new major only when its
    # controllers, security rules, and OpenAPI group are deployed in the same release.
    current-version: v1
    supported-versions: ${API_SUPPORTED_VERSIONS:v1}
    catalog:
      v1:
        lifecycle: CURRENT
        contract-version: 1.0.0-RELEASE
        released-at: "2026-09-18"
        frozen: true
        change-policy: ADDITIVE_ONLY
        notes: "Frozen fiscal API contract. Additive compatible changes only; breaking changes require a new major."
  security:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:8080}
    jwt:
      secret: ${JWT_SECRET:default-dev-ut-einvoice-platform-jwt-secret-key-at-least-256-bits-long}
      issuer: ${JWT_ISSUER:ut-einvoice-platform}
      audience: ${JWT_AUDIENCE:ut-einvoice-api}
    rate-tracking:
      authenticated-requests-per-second: ${RATE_LIMIT_AUTHENTICATED_RPS:20}
      anonymous-requests-per-second: ${RATE_LIMIT_ANONYMOUS_RPS:10}
    request-signing:
      # Supply a random secret of at least 32 bytes through the deployment environment.
      # Default is false to allow frontend and UI client access without machine-to-machine HMAC secrets.
      enabled: ${REQUEST_SIGNING_ENABLED:false}
      shared-secret: ${REQUEST_SIGNING_SHARED_SECRET:}
      max-clock-skew-seconds: ${REQUEST_SIGNING_MAX_CLOCK_SKEW_SECONDS:300}
      max-body-bytes: ${REQUEST_SIGNING_MAX_BODY_BYTES:10485760}

# Ministry of Revenues EIRS Gateway Configuration
mor:
  gateway:
    base-url: ${MOR_GATEWAY_BASE_URL:${MOR_GATEWAY_URL:http://core.mor.gov.et}}
    client-id: ${MOR_GATEWAY_CLIENT_ID:${MOR_CLIENT_ID:}}
    client-secret: ${MOR_GATEWAY_CLIENT_SECRET:${MOR_CLIENT_SECRET:}}
    api-key: ${MOR_GATEWAY_API_KEY:${MOR_API_KEY:}}
    seller-tin: ${MOR_GATEWAY_SELLER_TIN:${MOR_SELLER_TIN:}}
    system-number: ${MOR_GATEWAY_SYSTEM_NUMBER:${MOR_SYSTEM_NUMBER:8EFBBDD7FF}}
    system-type: ${MOR_GATEWAY_SYSTEM_TYPE:${MOR_SYSTEM_TYPE:POS}}
    auth-endpoint: /auth/login
    refresh-endpoint: /auth/refresh-token
    register-endpoint: /v1/register
    bulk-register-endpoint: /v1/bulkRegister
    cancel-endpoint: /v1/cancel
    verify-endpoint: /v1/verify
    receipt-endpoint: /v1/receipt/sales
    withholding-endpoint: /v1/receipt/withholding
    timeout-ms: 10000
    max-retry-attempts: 3
    retry-delay-ms: 2000

# Transactional SMS Gateway Configuration
notifications:
  sms:
    # Active SMS provider: geezsms (production), ethio-telecom, mock (dev/test)
    # Override with SMS_PROVIDER environment variable.
    active-provider: ${SMS_PROVIDER:mock}
    geezsms:
      # Production GeezSMS token — must be set via GEEZSMS_TOKEN environment variable.
      # Never hard-code here; keep out of source control.
      token: ${GEEZSMS_TOKEN:}
      api-url: ${GEEZSMS_API_URL:https://api.geezsms.com}
      sender-id: ${GEEZSMS_SENDER_ID:}
    ethio-telecom:
      endpoint: ${ETHIO_TELECOM_SMS_URL:}
      api-key: ${ETHIO_TELECOM_SMS_KEY:}
      sender-id: ${ETHIO_TELECOM_SMS_SENDER_ID:MoR-EIRS}

# SpringDoc / OpenAPI
springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    urls:
      - name: API v1 (stable)
        url: /v3/api-docs/v1

# Management & Observability
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      roles: ROLE_PLATFORM_ADMIN
