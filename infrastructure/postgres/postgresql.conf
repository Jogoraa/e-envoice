# =====================================================================
# UT Electronic Invoicing SaaS Platform — PostgreSQL Production Config
# Tuned for high write throughput, transactional outbox, and RLS security
# Target: Engineering capacity for 1,000,000 registered tenants
# =====================================================================

# CONNECTIONS & MEMORY
listen_addresses = '*'
max_connections = 300
shared_buffers = 2GB
effective_cache_size = 6GB
maintenance_work_mem = 512MB
work_mem = 32MB
huge_pages = try

# ROW LEVEL SECURITY (Directive No. 1142/2026 Tenancy Isolation)
row_security = on

# WRITE AHEAD LOG (WAL) & CHECKPOINTS
wal_level = replica
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 16GB
min_wal_size = 2GB
wal_buffers = 16MB
wal_writer_delay = 50ms

# DISK & NVMe OPTIMIZATIONS
random_page_cost = 1.1
effective_io_concurrency = 200
synchronous_commit = off           # Outbox pattern provides durability; off improves batch TPS

# QUERY TUNING
default_statistics_target = 100
enable_partition_pruning = on
enable_parallel_hash = on

# LOGGING & AUDIT
logging_collector = on
log_directory = 'log'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_min_messages = warning
log_min_error_statement = error
log_min_duration_statement = 250    # Log slow queries exceeding 250ms
log_line_prefix = '%m [%p] %q%u@%d [tenant:%c] '
log_timezone = 'UTC'

# LOCALE & ENCODING
datestyle = 'iso, mdy'
timezone = 'UTC'
lc_messages = 'en_US.utf8'
lc_monetary = 'en_US.utf8'
lc_numeric = 'en_US.utf8'
lc_time = 'en_US.utf8'
default_text_search_config = 'pg_catalog.english'
